<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>光影小畫家 - 螢光聲效畫板與豐富主題蓋印</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E8EEF5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
    }

    #app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      gap: 12px;
    }

    /* === 左側工具欄（畫筆 ＋ 主題分頁 ＋ 圖案蓋印）=== */
    #left-sidebar {
      width: 262px;
      min-width: 240px;
      background-color: #1E2532;
      border-radius: 24px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .sidebar-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sidebar-section-title {
      color: #FFD60A;
      font-size: 0.96rem;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .size-toggle-btn {
      background-color: #323D52;
      color: #00E5FF;
      border: 2px solid #00E5FF;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .size-toggle-btn:active {
      transform: scale(0.94);
    }

    /* 畫筆顏色按鈕列（2 排共 8 枝：4 鮮明色 ＋ 3 螢光色 ＋ 1 彩虹筆） */
    .brush-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .brush-btn {
      height: 44px;
      border-radius: 12px;
      border: 3px solid rgba(255, 255, 255, 0.28);
      background-color: #2C3545;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      position: relative;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .brush-btn .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
    }

    .brush-btn.neon-btn .color-dot {
      box-shadow: 0 0 10px currentColor;
    }

    .neon-badge {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 0.62rem;
      font-weight: 900;
      color: #FFFF00;
      text-shadow: 0 1px 2px #000;
    }

    .rainbow-dot {
      background: conic-gradient(#FF2A2A, #FF9900, #FFEE00, #00D94A, #0088FF, #A64DFF, #FF2A2A);
    }

    .brush-btn.active {
      border-color: #FFD60A;
      background-color: #384459;
      transform: scale(1.07);
      box-shadow: 0 0 12px rgba(255, 214, 10, 0.85);
    }

    .divider-line {
      height: 2px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    /* 5 大主題分類分頁按鈕 */
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .cat-tab-btn {
      background-color: #2C3545;
      color: #E2E8F0;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 6px 2px;
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    .cat-tab-btn.active {
      background-color: #FFD60A;
      color: #000000;
      border-color: #FFD60A;
    }

    /* 圖案蓋印網格 */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      flex: 1;
      overflow-y: auto;
      align-content: start;
      padding-right: 2px;
    }

    .stamp-btn {
      background-color: #2C3545;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .stamp-btn .stamp-emoji {
      font-size: 2.1rem;
      line-height: 1.1;
    }

    .stamp-btn .stamp-label {
      color: #FFFFFF;
      font-size: 0.84rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .stamp-btn.active {
      border-color: #00FF66;
      background-color: #1F4732;
      transform: scale(1.04);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.65);
    }

    /* === 右側主畫板區 === */
    #right-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    /* 頂部控制欄（8 款畫紙場景 ＋ 還原 ＋ 清空 ＋ 完成啦音樂慶祝） */
    #top-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #FFFFFF;
      border-radius: 20px;
      padding: 8px 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      gap: 8px;
      flex-wrap: wrap;
    }

    .bg-picker-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bg-picker-label {
      font-size: 0.94rem;
      font-weight: 900;
      color: #1E2532;
    }

    .bg-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid #99A3B0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.08rem;
      padding: 0;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .bg-swatch.active {
      border: 4px solid #0055FF;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(0, 85, 255, 0.55);
    }

    #current-tool-banner {
      font-size: 1.04rem;
      font-weight: 900;
      color: #003380;
      background: #EBF3FF;
      padding: 6px 12px;
      border-radius: 14px;
      white-space: nowrap;
    }

    .action-btns-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tool-action-btn {
      border: none;
      border-radius: 15px;
      padding: 8px 14px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
    }

    .tool-action-btn:active {
      transform: scale(0.95);
    }

    #undo-btn {
      background-color: #FFCC00;
      color: #000000;
    }

    #clear-btn {
      background-color: #FF453A;
      color: #FFFFFF;
    }

    #finish-btn {
      background: linear-gradient(135deg, #00D94A, #00A838);
      color: #FFFFFF;
      border: 2px solid #004D1A;
      font-size: 1.08rem;
      padding: 8px 16px;
      box-shadow: 0 4px 14px rgba(0, 200, 70, 0.45);
    }

    /* 畫布外框 */
    #canvas-wrapper {
      flex: 1;
      border-radius: 26px;
      border: 6px solid #1E2532;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.15);
      background-color: #FAF8F2;
    }

    #draw-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    #audio-unlock-toast {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(30, 37, 50, 0.92);
      color: #FFD60A;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 1.08rem;
      font-weight: 800;
      pointer-events: none;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }

    /* === 完成畫作音樂慶祝彈窗 === */
    #celebrate-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(15, 22, 36, 0.78);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .celebrate-card {
      background-color: #1E2532;
      border: 5px solid #FFD60A;
      border-radius: 28px;
      padding: 24px 32px;
      max-width: 560px;
      width: 92%;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
      animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .music-notes-banner {
      font-size: 3.4rem;
      margin-bottom: 6px;
      animation: bounceNotes 0.9s infinite alternate ease-in-out;
    }

    @keyframes bounceNotes {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.08); }
    }

    .celebrate-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #FFD60A;
      margin: 4px 0 8px 0;
    }

    .celebrate-subtitle {
      font-size: 1.15rem;
      color: #FFFFFF;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .song-selector-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .song-btn {
      background-color: #2C3545;
      color: #FFFFFF;
      border: 3px solid #00E5FF;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 1.02rem;
      font-weight: 900;
      cursor: pointer;
    }

    .song-btn.playing {
      background-color: #00E5FF;
      color: #000000;
    }

    .celebrate-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cel-btn {
      border: none;
      border-radius: 18px;
      padding: 13px 22px;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
    }

    .cel-btn:active {
      transform: scale(0.95);
    }

    #save-art-btn {
      background-color: #FFD60A;
      color: #000000;
    }

    #keep-drawing-btn {
      background-color: #00FF66;
      color: #000000;
    }

    .firework-dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 45;
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <!-- 左側工具欄：畫筆顏色（含螢光筆）＋ 5 大主題圖案蓋印 -->
    <div id="left-sidebar">
      <div class="sidebar-header-row">
        <span class="sidebar-section-title">🖌️ 揀畫筆（⚡螢光）</span>
        <button type="button" class="size-toggle-btn" id="brush-size-btn">筆粗：特粗</button>
      </div>
      <div class="brush-row" id="brush-list">
        <!-- 第一行：4 隻鮮明色 -->
        <button type="button" class="brush-btn active" data-color="#E62E2D" data-neon="false" data-name="紅色畫筆">
          <div class="color-dot" style="background:#E62E2D;"></div>
        </button>
        <button type="button" class="brush-btn" data-color="#0066FF" data-neon="false" data-name="藍色畫筆">
          <div class="color-dot" style="background:#0066FF;"></div>
        </button>
        <button type="button" class="brush-btn" data-color="#00A843" data-neon="false" data-name="綠色畫筆">
          <div class="color-dot" style="background:#00A843;"></div>
        </button>
        <button type="button" class="brush-btn" data-color="#FF9500" data-neon="false" data-name="橙色畫筆">
          <div class="color-dot" style="background:#FF9500;"></div>
        </button>

        <!-- 第二行：3 隻高對比螢光發光筆 ＋ 1 隻彩虹筆 -->
        <button type="button" class="brush-btn neon-btn" data-color="#FFFF00" data-neon="true" data-name="螢光黃畫筆" title="高對比螢光黃">
          <div class="color-dot" style="background:#FFFF00; color:#FFFF00;"></div>
          <span class="neon-badge">⚡</span>
        </button>
        <button type="button" class="brush-btn neon-btn" data-color="#00FF66" data-neon="true" data-name="螢光綠畫筆" title="高對比螢光綠">
          <div class="color-dot" style="background:#00FF66; color:#00FF66;"></div>
          <span class="neon-badge">⚡</span>
        </button>
        <button type="button" class="brush-btn neon-btn" data-color="#FF2A85" data-neon="true" data-name="螢光粉紅畫筆" title="高對比螢光粉紅">
          <div class="color-dot" style="background:#FF2A85; color:#FF2A85;"></div>
          <span class="neon-badge">⚡</span>
        </button>
        <button type="button" class="brush-btn" data-color="rainbow" data-neon="true" data-name="彩虹變色筆" title="彩虹魔法筆">
          <div class="color-dot rainbow-dot"></div>
        </button>
      </div>

      <div class="divider-line"></div>

      <div class="sidebar-header-row">
        <span class="sidebar-section-title">🪄 主題蓋印（50款）</span>
        <button type="button" class="size-toggle-btn" id="stamp-size-btn">圖案：特大</button>
      </div>
      <div class="category-tabs" id="category-tabs">
        <button type="button" class="cat-tab-btn active" data-cat="common">🌟 常用</button>
        <button type="button" class="cat-tab-btn" data-cat="christmas">🎄 聖誕</button>
        <button type="button" class="cat-tab-btn" data-cat="animals">🐶 動物</button>
        <button type="button" class="cat-tab-btn" data-cat="ocean">🌊 海洋</button>
        <button type="button" class="cat-tab-btn" data-cat="food_car">🍎 生活</button>
      </div>

      <div class="stamps-grid" id="stamps-list"></div>
    </div>

    <!-- 右側主畫板區 -->
    <div id="right-workspace">
      <div id="top-toolbar">
        <div class="bg-picker-group">
          <span class="bg-picker-label">🎨 畫紙：</span>
          <button type="button" class="bg-swatch active" data-bg="cream" title="柔和米白" style="background:#FAF8F2;"></button>
          <button type="button" class="bg-swatch" data-bg="skyblue" title="護眼淺藍" style="background:#DCEEFF;"></button>
          <button type="button" class="bg-swatch" data-bg="warmyellow" title="溫暖淺黃" style="background:#FFF6CC;"></button>
          <button type="button" class="bg-swatch" data-bg="black_hc" title="深黑高對比（配螢光筆）" style="background:#0B0E14; color:#FFFF00;">⚡</button>
          <button type="button" class="bg-swatch" data-bg="scene_xmas" title="聖誕雪夜場景" style="background:linear-gradient(180deg,#102040 65%,#EBF5FF 65%);">🎄</button>
          <button type="button" class="bg-swatch" data-bg="scene_park" title="草地藍天場景" style="background:linear-gradient(180deg,#87CEEB 65%,#7EC850 65%);">🌳</button>
          <button type="button" class="bg-swatch" data-bg="scene_ocean" title="海底世界場景" style="background:linear-gradient(180deg,#006994 70%,#F2D184 70%);">🌊</button>
          <button type="button" class="bg-swatch" data-bg="scene_space" title="星空宇宙場景" style="background:#141836;">🌌</button>
        </div>

        <div id="current-tool-banner">🖌️ 紅色畫筆</div>

        <div class="action-btns-group">
          <button type="button" class="tool-action-btn" id="undo-btn">↩️ 還原</button>
          <button type="button" class="tool-action-btn" id="clear-btn">🗑️ 清空</button>
          <button type="button" class="tool-action-btn" id="finish-btn">🎉 完成啦！</button>
        </div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="draw-canvas"></canvas>
        <div id="audio-unlock-toast">👆 用手指畫畫會一路響出音樂聲效，也可以點左邊圖案蓋印！</div>

        <!-- 完成畫作音樂慶祝遮罩 -->
        <div id="celebrate-overlay">
          <div class="celebrate-card">
            <div class="music-notes-banner">🎶 🎨 🎵</div>
            <div class="celebrate-title">哇！畫得好靚呀！</div>
            <div class="celebrate-subtitle">點選下面音樂掣，一齊聽住音樂欣賞你嘅作品：</div>

            <div class="song-selector-row">
              <button type="button" class="song-btn" data-song="twinkle">🎵 播《小星星》</button>
              <button type="button" class="song-btn" data-song="jingle">🎄 播《聖誕鈴聲》</button>
              <button type="button" class="song-btn" data-song="happy">🎉 播《快樂頌》</button>
            </div>

            <div class="celebrate-actions">
              <button type="button" class="cel-btn" id="save-art-btn">📸 儲存畫作相片</button>
              <button type="button" class="cel-btn" id="keep-drawing-btn">🖌️ 繼續畫畫</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === 5 大主題 WhatsApp 豐富圖案庫（共 50 款）===
    const STAMP_CATEGORIES = {
      common: [
        { emoji: '⭐', name: '星星' },
        { emoji: '❤️', name: '心心' },
        { emoji: '😊', name: '笑臉' },
        { emoji: '☀️', name: '太陽' },
        { emoji: '🌸', name: '花朵' },

        { emoji: '🎈', name: '氣球' },
        { emoji: '🎵', name: '音樂' },
        { emoji: '👑', name: '皇冠' },
        { emoji: '💎', name: '鑽石' }
      ],
      christmas: [
        { emoji: '🎄', name: '聖誕樹' },
        { emoji: '🎅', name: '聖誕老人' },
        { emoji: '⛄', name: '雪人' },

        { emoji: '❄️', name: '雪花' },
        { emoji: '🦌', name: '麋鹿' },
        { emoji: '🔔', name: '聖誕鐘' },
        { emoji: '🍬', name: '糖果' },
        { emoji: '🧦', name: '聖誕襪' },
        { emoji: '🕯️', name: '蠟燭' }
      ],
      animals: [
        { emoji: '🐶', name: '小狗' },
        { emoji: '🐱', name: '小貓' },
        { emoji: '🐰', name: '兔仔' },
        { emoji: '🐻', name: '熊仔' },
        { emoji: '🦋', name: '蝴蝶' },
        { emoji: '🐤', name: '小鳥' },
        { emoji: '🐼', name: '熊貓' },
        { emoji: '🦁', name: '獅子' },
        { emoji: '🐘', name: '大象' },
        { emoji: '🐸', name: '青蛙' }
      ],
      ocean: [
        { emoji: '🐬', name: '海豚' },
        { emoji: '🐳', name: '鯨魚' },
        { emoji: '🐠', name: '熱帶魚' },
        { emoji: '🐙', name: '八爪魚' },
        { emoji: '🦀', name: '螃蟹' },
        { emoji: '🐢', name: '海龜' },
        { emoji: '🐚', name: '貝殼' },
        { emoji: '🪼', name: '水母' },
        { emoji: '⛵', name: '帆船' },
        { emoji: '🏝️', name: '小島' }
      ],
      food_car: [
        { emoji: '🍎', name: '蘋果' },
        { emoji: '🍓', name: '士多啤梨' },
        { emoji: '🍌', name: '香蕉' },
        { emoji: '🎂', name: '蛋糕' },
        { emoji: '🍦', name: '雪糕' },
        { emoji: '🚗', name: '汽車' },
        { emoji: '🚌', name: '巴士' },
        { emoji: '🚒', name: '消防車' },
        { emoji: '✈️', name: '飛機' },
        { emoji: '🚀', name: '火箭' }
      ]
    };

    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');
    const currentToolBanner = document.getElementById('current-tool-banner');
    const unlockToast = document.getElementById('audio-unlock-toast');
    const stampsListEl = document.getElementById('stamps-list');
    const celebrateOverlay = document.getElementById('celebrate-overlay');

    // === 畫板狀態 ===
    const appState = {
      mode: 'brush', // 'brush' | 'stamp'
      activeCategory: 'common',
      brushColor: '#E62E2D',
      isNeon: false,
      brushName: '紅色畫筆',
      brushSize: 22, // 22 (特粗) | 10 (普通)
      stampEmoji: '⭐',
      stampName: '星星',
      stampSize: 108, // 108 (特大) | 68 (標準)
      bgStyle: 'cream',
      history: []
    };

    let isDrawing = false;
    let currentStroke = null;
    let rainbowHue = 0;
    let lastStampTime = 0;
    let lastStampPos = { x: -999, y: -999 };
    let lastStrokeSoundTime = 0;
    let strokeStepIndex = 0;
    let audioUnlocked = false;

    // === Web Audio API 邊畫邊響聲效與童趣旋律播放器 ===
    let audioCtx = null;
    let songTimers = [];

    function unlockAudioAndSpeech() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioUnlocked) {
        audioUnlocked = true;
        unlockToast.style.opacity = '0';
        if ('speechSynthesis' in window) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        }
      }
    }

    function stopMelody() {
      songTimers.forEach(t => clearTimeout(t));
      songTimers = [];
      document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('playing'));
    }

    function playNoteTone(freq, duration = 0.28, waveType = 'triangle', vol = 0.22) {
      if (!audioCtx || freq <= 0) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // 畫筆滑動時的魔法風鈴聲效（隨高度與步進變化音高，聽起來像音樂琴鍵）
    const BRUSH_SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];

    function playBrushSparkleSound(yPos, canvasHeight) {
      if (!audioCtx) return;
      const nowMs = Date.now();
      if (nowMs - lastStrokeSoundTime < 75) return; // 控制發音節奏不刺耳
      lastStrokeSoundTime = nowMs;

      // 結合手指上下位置（越往上音越高）與流動音階
      const normY = Math.max(0, Math.min(1, 1 - (yPos / Math.max(1, canvasHeight))));
      const heightIdx = Math.floor(normY * (BRUSH_SCALE.length - 1));
      const scaleIdx = (heightIdx + (strokeStepIndex % 3)) % BRUSH_SCALE.length;
      strokeStepIndex += 1;

      const freq = BRUSH_SCALE[scaleIdx];
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = appState.isNeon ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }

    function playStampPopSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    // 內置三首輕快童趣旋律
    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25
    };

    const SONGS = {
      twinkle: [
        [NOTES.C4, 340], [NOTES.C4, 340], [NOTES.G4, 340], [NOTES.G4, 340],
        [NOTES.A4, 340], [NOTES.A4, 340], [NOTES.G4, 650],
        [NOTES.F4, 340], [NOTES.F4, 340], [NOTES.E4, 340], [NOTES.E4, 340],
        [NOTES.D4, 340], [NOTES.D4, 340], [NOTES.C4, 680]
      ],
      jingle: [
        [NOTES.E4, 280], [NOTES.E4, 280], [NOTES.E4, 540],
        [NOTES.E4, 280], [NOTES.E4, 280], [NOTES.E4, 540],
        [NOTES.E4, 280], [NOTES.G4, 280], [NOTES.C4, 360], [NOTES.D4, 240],
        [NOTES.E4, 720],
        [NOTES.F4, 280], [NOTES.F4, 280], [NOTES.F4, 340], [NOTES.F4, 240],
        [NOTES.F4, 280], [NOTES.E4, 280], [NOTES.E4, 280], [NOTES.E4, 280],
        [NOTES.G4, 280], [NOTES.G4, 280], [NOTES.F4, 280], [NOTES.D4, 280],
        [NOTES.C4, 700]
      ],
      happy: [
        [NOTES.E4, 300], [NOTES.E4, 300], [NOTES.F4, 300], [NOTES.G4, 300],
        [NOTES.G4, 300], [NOTES.F4, 300], [NOTES.E4, 300], [NOTES.D4, 300],
        [NOTES.C4, 300], [NOTES.C4, 300], [NOTES.D4, 300], [NOTES.E4, 300],
        [NOTES.E4, 440], [NOTES.D4, 200], [NOTES.D4, 620]
      ]
    };

    function playSong(songKey) {
      unlockAudioAndSpeech();
      stopMelody();
      const btn = document.querySelector(`.song-btn[data-song="${songKey}"]`);
      if (btn) btn.classList.add('playing');

      const seq = SONGS[songKey] || SONGS.twinkle;
      let elapsed = 80;
      seq.forEach(([freq, dur]) => {
        const t = setTimeout(() => {
          playNoteTone(freq, (dur / 1000) * 0.92, 'triangle', 0.24);
        }, elapsed);
        songTimers.push(t);
        elapsed += dur;
      });

      const endTimer = setTimeout(() => {
        if (btn) btn.classList.remove('playing');
      }, elapsed + 100);
      songTimers.push(endTimer);
    }

    // === 廣東話語音提示 ===
    let cantoneseVoice = null;
    let speechTimer = null;

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

    if ('speechSynthesis' in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text, onFinished = null) {
      if (!('speechSynthesis' in window) || !text) {
        if (onFinished) onFinished();
        return;
      }
      if (speechTimer) clearTimeout(speechTimer);
      window.speechSynthesis.cancel();
      speechTimer = setTimeout(() => {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        const utter = new SpeechSynthesisUtterance(String(text));
        utter.lang = 'zh-HK';
        if (cantoneseVoice) utter.voice = cantoneseVoice;
        utter.rate = 0.88;
        utter.pitch = 1.15;
        if (onFinished) utter.onend = onFinished;
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    // === 渲染左側目前主題的圖案按鈕 ===
    function renderStampButtons() {
      stampsListEl.innerHTML = '';
      const list = STAMP_CATEGORIES[appState.activeCategory] || STAMP_CATEGORIES.common;

      list.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isSelected = (appState.mode === 'stamp' && appState.stampEmoji === item.emoji);
        btn.className = 'stamp-btn' + (isSelected ? ' active' : '');
        btn.innerHTML = `
          <span class="stamp-emoji">${item.emoji}</span>
          <span class="stamp-label">${item.name}</span>
        `;

        btn.addEventListener('click', () => {
          unlockAudioAndSpeech();
          document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
          appState.mode = 'stamp';
          appState.stampEmoji = item.emoji;
          appState.stampName = item.name;
          renderStampButtons();
          currentToolBanner.textContent = `${item.emoji} ${item.name}`;
          speakCantonese(item.name);
        });

        stampsListEl.appendChild(btn);
      });
    }

    // === 主題分類切換 ===
    document.querySelectorAll('.cat-tab-btn').forEach(tab => {
      tab.addEventListener('click', () => {
        unlockAudioAndSpeech();
        document.querySelectorAll('.cat-tab-btn').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        appState.activeCategory = tab.dataset.cat;
        renderStampButtons();
      });
    });

    // === 筆粗與圖案大細一按切換 ===
    const brushSizeBtn = document.getElementById('brush-size-btn');
    brushSizeBtn.addEventListener('click', () => {
      unlockAudioAndSpeech();
      if (appState.brushSize === 22) {
        appState.brushSize = 10;
        brushSizeBtn.textContent = '筆粗：普通';
      } else {
        appState.brushSize = 22;
        brushSizeBtn.textContent = '筆粗：特粗';
      }
    });

    const stampSizeBtn = document.getElementById('stamp-size-btn');
    stampSizeBtn.addEventListener('click', () => {
      unlockAudioAndSpeech();
      if (appState.stampSize === 108) {
        appState.stampSize = 68;
        stampSizeBtn.textContent = '圖案：標準';
      } else {
        appState.stampSize = 108;
        stampSizeBtn.textContent = '圖案：特大';
      }
    });

    // === 8 款畫布底色與情境背景繪製 ===
    function drawBackgroundLayer(w, h) {
      if (appState.bgStyle === 'cream') {
        ctx.fillStyle = '#FAF8F2';
        ctx.fillRect(0, 0, w, h);
      } else if (appState.bgStyle === 'skyblue') {
        ctx.fillStyle = '#DCEEFF';
        ctx.fillRect(0, 0, w, h);
      } else if (appState.bgStyle === 'warmyellow') {
        ctx.fillStyle = '#FFF6CC';
        ctx.fillRect(0, 0, w, h);
      } else if (appState.bgStyle === 'black_hc') {
        // 深黑高對比背景（最適合配合螢光畫筆）
        ctx.fillStyle = '#0B0E14';
        ctx.fillRect(0, 0, w, h);
      } else if (appState.bgStyle === 'scene_xmas') {
        // 聖誕雪地夜空場景
        ctx.fillStyle = '#132442';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#EAF4FC';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.72);
        ctx.quadraticCurveTo(w * 0.5, h * 0.64, w, h * 0.74);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFF3B0';
        ctx.beginPath();
        ctx.arc(w * 0.86, h * 0.16, 34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        [[0.12,0.18],[0.25,0.35],[0.42,0.14],[0.58,0.28],[0.72,0.12],[0.18,0.52],[0.65,0.48],[0.88,0.42]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.arc(w * sx, h * sy, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (appState.bgStyle === 'scene_park') {
        // 草地藍天場景
        ctx.fillStyle = '#B8E4FF';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#8CD964';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.70);
        ctx.quadraticCurveTo(w * 0.45, h * 0.63, w, h * 0.72);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        [[0.22, 0.18], [0.72, 0.22]].forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(w * cx, h * cy, 28, 0, Math.PI * 2);
          ctx.arc(w * cx + 26, h * cy + 4, 22, 0, Math.PI * 2);
          ctx.arc(w * cx - 26, h * cy + 6, 22, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (appState.bgStyle === 'scene_ocean') {
        // 海底世界場景
        const grad = ctx.createLinearGradient(0, 0, 0, h * 0.82);
        grad.addColorStop(0, '#38B6FF');
        grad.addColorStop(1, '#005A8D');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // 海底金黃沙地
        ctx.fillStyle = '#F5D68E';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.80);
        ctx.quadraticCurveTo(w * 0.35, h * 0.74, w * 0.7, h * 0.81);
        ctx.quadraticCurveTo(w * 0.88, h * 0.84, w, h * 0.78);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        // 水底氣泡
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 3;
        [[0.15,0.62,10],[0.17,0.48,7],[0.82,0.58,12],[0.80,0.42,8],[0.48,0.32,9]].forEach(([bx, by, br]) => {
          ctx.beginPath();
          ctx.arc(w * bx, h * by, br, 0, Math.PI * 2);
          ctx.stroke();
        });
      } else if (appState.bgStyle === 'scene_space') {
        // 星空宇宙場景
        ctx.fillStyle = '#121633';
        ctx.fillRect(0, 0, w, h);
        // 閃爍小星星
        ctx.fillStyle = '#FFF59D';
        [[0.14,0.20,4],[0.28,0.12,3],[0.45,0.24,5],[0.64,0.15,3],[0.82,0.22,4],[0.20,0.65,3],[0.76,0.68,4],[0.52,0.78,3]].forEach(([sx, sy, sr]) => {
          ctx.beginPath();
          ctx.arc(w * sx, h * sy, sr, 0, Math.PI * 2);
          ctx.fill();
        });
        // 遠處星球
        ctx.fillStyle = '#FF9E6D';
        ctx.beginPath();
        ctx.arc(w * 0.82, h * 0.24, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFD180';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(w * 0.82, h * 0.24, 52, 12, -0.3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function resizeCanvas() {
      const rect = canvasWrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redrawAll();
    }

    function redrawAll() {
      const rect = canvasWrapper.getBoundingClientRect();
      drawBackgroundLayer(rect.width, rect.height);

      for (const item of appState.history) {
        if (item.type === 'stroke') {
          drawStrokePath(item);
        } else if (item.type === 'stamp') {
          drawStampItem(item);
        }
      }
    }

    function drawStrokePath(stroke) {
      if (!stroke.points || stroke.points.length === 0) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = stroke.size;

      if (stroke.isNeon) {
        ctx.shadowBlur = 16;
        ctx.shadowColor = stroke.isRainbow ? '#FFFFFF' : stroke.color;
      }

      if (stroke.isRainbow) {
        if (stroke.points.length === 1) {
          const c = `hsl(${stroke.points[0].hue || 0}, 100%, 55%)`;
          ctx.beginPath();
          ctx.arc(stroke.points[0].x, stroke.points[0].y, stroke.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = c;
          ctx.fill();
        } else {
          for (let i = 1; i < stroke.points.length; i++) {
            const c = `hsl(${stroke.points[i].hue || 0}, 100%, 55%)`;
            ctx.beginPath();
            ctx.strokeStyle = c;
            if (stroke.isNeon) ctx.shadowColor = c;
            ctx.moveTo(stroke.points[i - 1].x, stroke.points[i - 1].y);
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
            ctx.stroke();
          }
        }
      } else {
        ctx.strokeStyle = stroke.color;
        ctx.beginPath();
        if (stroke.points.length === 1) {
          ctx.arc(stroke.points[0].x, stroke.points[0].y, stroke.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = stroke.color;
          ctx.fill();
        } else {
          ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
          }
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawStampItem(stamp) {
      ctx.save();
      ctx.font = `${stamp.size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(stamp.emoji, stamp.x, stamp.y);
      ctx.restore();
    }

    // === 畫板觸控與滑鼠繪畫 / 蓋印事件 ===
    function getCanvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function placeStampAt(pt) {
      const stampAction = {
        type: 'stamp',
        emoji: appState.stampEmoji,
        x: pt.x,
        y: pt.y,
        size: appState.stampSize
      };
      appState.history.push(stampAction);
      drawStampItem(stampAction);
      playStampPopSound();
      if (navigator.vibrate) navigator.vibrate(35);

      lastStampTime = Date.now();
      lastStampPos = pt;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      unlockAudioAndSpeech();
      canvas.setPointerCapture(e.pointerId);
      const pt = getCanvasPoint(e);
      const rect = canvasWrapper.getBoundingClientRect();

      if (appState.mode === 'brush') {
        isDrawing = true;
        const isRainbow = (appState.brushColor === 'rainbow');
        if (isRainbow) {
          pt.hue = rainbowHue;
          rainbowHue = (rainbowHue + 10) % 360;
        }
        currentStroke = {
          type: 'stroke',
          color: appState.brushColor,
          isRainbow: isRainbow,
          isNeon: appState.isNeon,
          size: appState.brushSize,
          points: [pt]
        };
        appState.history.push(currentStroke);
        drawStrokePath(currentStroke);
        playBrushSparkleSound(pt.y, rect.height);
      } else if (appState.mode === 'stamp') {
        isDrawing = true;
        placeStampAt(pt);
        speakCantonese(appState.stampName);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pt = getCanvasPoint(e);
      const rect = canvasWrapper.getBoundingClientRect();

      if (appState.mode === 'brush' && currentStroke) {
        const prev = currentStroke.points[currentStroke.points.length - 1];
        if (currentStroke.isRainbow) {
          pt.hue = rainbowHue;
          rainbowHue = (rainbowHue + 8) % 360;
        }
        currentStroke.points.push(pt);

        const segColor = currentStroke.isRainbow ? `hsl(${pt.hue}, 100%, 55%)` : currentStroke.color;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = segColor;
        ctx.lineWidth = currentStroke.size;
        if (currentStroke.isNeon) {
          ctx.shadowBlur = 16;
          ctx.shadowColor = segColor;
        }
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        ctx.restore();

        // 一路畫畫一路發出悅耳音樂風鈴聲效
        playBrushSparkleSound(pt.y, rect.height);
      } else if (appState.mode === 'stamp') {
        const minGap = Math.max(76, appState.stampSize * 0.85);
        const dist = Math.hypot(pt.x - lastStampPos.x, pt.y - lastStampPos.y);
        if (dist >= minGap && Date.now() - lastStampTime >= 140) {
          placeStampAt(pt);
        }
      }
    });

    const stopDrawing = () => {
      isDrawing = false;
      currentStroke = null;
    };

    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    // === 左側畫筆選擇事件 ===
    document.querySelectorAll('.brush-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        unlockAudioAndSpeech();
        document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        appState.mode = 'brush';
        appState.brushColor = btn.dataset.color;
        appState.isNeon = (btn.dataset.neon === 'true');
        appState.brushName = btn.dataset.name;
        renderStampButtons();
        currentToolBanner.textContent = `🖌️ ${appState.brushName}`;
        speakCantonese(appState.brushName);
      });
    });

    // === 頂部畫紙場景切換 ===
    document.querySelectorAll('.bg-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        unlockAudioAndSpeech();
        document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');

        appState.bgStyle = swatch.dataset.bg;
        redrawAll();
      });
    });

    // === 還原上一步 & 清空畫板 ===
    document.getElementById('undo-btn').addEventListener('click', () => {
      unlockAudioAndSpeech();
      if (appState.history.length > 0) {
        appState.history.pop();
        redrawAll();
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      unlockAudioAndSpeech();
      if (appState.history.length === 0) return;
      appState.history = [];
      redrawAll();
      speakCantonese('畫板清空啦！');
    });

    // === 🎉「完成啦！」音樂慶祝與煙花 ===
    function spawnCelebrationFireworks() {
      const rect = canvasWrapper.getBoundingClientRect();
      const colors = ['#FFD60A', '#00FF66', '#FF3366', '#00E5FF', '#FF9900'];
      const centers = [
        [rect.width * 0.25, rect.height * 0.35],
        [rect.width * 0.75, rect.height * 0.35],
        [rect.width * 0.50, rect.height * 0.25]
      ];

      centers.forEach(([cx, cy], burstIdx) => {
        setTimeout(() => {
          for (let i = 0; i < 16; i++) {
            const dot = document.createElement('div');
            dot.className = 'firework-dot';
            const size = 12 + Math.random() * 12;
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            dot.style.backgroundColor = colors[(i + burstIdx) % colors.length];
            dot.style.left = `${cx}px`;
            dot.style.top = `${cy}px`;
            canvasWrapper.appendChild(dot);

            const angle = (Math.PI * 2 * i) / 16;
            const dist = 80 + Math.random() * 130;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist;

            dot.animate([
              { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
              { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
            ], {
              duration: 750,
              easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
            }).onfinish = () => dot.remove();
          }
        }, burstIdx * 240);
      });
    }

    document.getElementById('finish-btn').addEventListener('click', () => {
      unlockAudioAndSpeech();
      celebrateOverlay.style.display = 'flex';
      spawnCelebrationFireworks();
      if (navigator.vibrate) navigator.vibrate([60, 50, 80]);

      const defaultSong = (appState.activeCategory === 'christmas' || appState.bgStyle === 'scene_xmas')
        ? 'jingle'
        : 'twinkle';

      speakCantonese('哇！畫得好靚呀！你係小畫家！', () => {
        if (celebrateOverlay.style.display === 'flex') {
          playSong(defaultSong);
        }
      });
    });

    document.querySelectorAll('.song-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        playSong(btn.dataset.song);
      });
    });

    document.getElementById('save-art-btn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `我的畫作_${new Date().toISOString().slice(0, 10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      speakCantonese('畫作儲存好啦！');
    });

    document.getElementById('keep-drawing-btn').addEventListener('click', () => {
      stopMelody();
      celebrateOverlay.style.display = 'none';
    });

    window.addEventListener('resize', resizeCanvas);
    renderStampButtons();
    resizeCanvas();
  </script>
</body>
</html>
